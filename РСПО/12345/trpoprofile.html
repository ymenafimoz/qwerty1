<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Мотоцикл</title>
    <link rel="stylesheet" type="text/css" href="head.css"/>
    <link rel="stylesheet" type="text/css" href="font/head.css"/>
</head>
<body>
    <header class="container-field">
        <div class="container d-flex">
            <img src="логотип кинотеатра.jpg" width="50" height="50" alt="logo" />
            
            <nav class="menu">
                <a href="trpost.html">Каталог</a>
                <a href="trpoaboutus.html">О нас</a>
                <a href="trpokorzina.html">Корзина</a>
                <a href="trpocontacs.html">Контакты</a>
            </nav>
            <div class="formauthorization">
                <button class="profile" id="profileButton" onclick="document.location='trpoprofile.html'" style="display: none;">Личный кабинет</button>
                <button class="registration" id="registrationButton" onclick="document.location='trporeg.html'" style="display: inline;">Зарегистрироваться</button>
                <button class="authorization" id="authorizationButton" onclick="document.location='trpoaut.html'" style="display: inline;">Войти</button>
            </div>
        </div>
    </header>
    <div class="fon">
        <h1>Личный кабинет</h1>
        <div class="name">
            <input type="text" id="firstName" placeholder="Имя" height="40px">
            <button onclick="updateName()">Изменить</button>
        </div>
        <div class="surname">
            <input type="text" id="lastName" placeholder="Фамилия">
            <button onclick="updateSurname()">Изменить</button>
        </div>
        <div class="save">
            <button onclick="saveProfile()">Сохранить</button>
            <form id="exit" action="">
                <button class="exit" type="submit">Выйти</button>
            </form>
        </div>
    </div>
    <footer class="footer">
        <div class="d-flex2">
            <div class="leftcol">
                <div class="image">
                    <a href="https://www.instagram.com/_kbip.official_/" target="_blank">
                        <img class="imgg" src="icons8-instagram-96.webp" width="90px" height="90px">
                    </a>              
                </div>
                <div class="image">
                    <a href="https://web.telegram.org/k/#@kbpbrest" target="_blank">
                        <img class="imgg" src="icons8-логотип-telegram-96.webp" width="90px" height="90px">
                    </a>              
                </div>
                <div class="image">
                    <a href="https://vk.com/kbpby?ysclid=m49yfi7rg6293926969" target="_blank">
                        <img class="imgg" src="icons8-vkontakte-96.webp" width="90px" height="90px">
                    </a>              
                </div>
            </div>
            <div class="rightcol">
                <div class="font2">
                    <p>Телефон:+375(29)456-78-90</p>
                    <p>Email:info@kino_shop.com</p>
                    <p>Адрес:ул.крутая 10,г.Кипр</p>
                </div>
            </div>
        </div>
    </footer>
    <script>
        const exit = document.getElementById('exit');
        exit.addEventListener('submit', function(event) {
            event.preventDefault();
            localStorage.removeItem('username'); // Удаляем данные из localStorage
            localStorage.removeItem('password');
            localStorage.removeItem('firstName'); // Удаляем имя
            localStorage.removeItem('lastName'); // Удаляем фамилию
            document.getElementById('profileButton').style.display = 'none';
            document.getElementById('registrationButton').style.display = 'inline';
            document.getElementById('authorizationButton').style.display = 'inline';
            document.location = 'trpost.html'; // Перенаправление на каталог
        });

        function updateUI() {
            const username = localStorage.getItem('username');
            const firstName = localStorage.getItem('firstName');
            const lastName = localStorage.getItem('lastName');

 if (username) {
                document.getElementById('profileButton').style.display = 'inline';
                document.getElementById('registrationButton').style.display = 'none';
                document.getElementById('authorizationButton').style.display = 'none';
                document.getElementById('firstName').value = firstName || '';
                document.getElementById('lastName').value = lastName || '';
            } else {
                document.getElementById('profileButton').style.display = 'none';
                document.getElementById('registrationButton').style.display = 'inline';
                document.getElementById('authorizationButton').style.display = 'inline';
            }
        }

        function updateName() {
            const newName = document.getElementById('firstName').value;
            localStorage.setItem('firstName', newName);
        }

        function updateSurname() {
            const newSurname = document.getElementById('lastName').value;
            localStorage.setItem('lastName', newSurname);
        }

        function saveProfile() {
            alert('Профиль сохранен!');
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
