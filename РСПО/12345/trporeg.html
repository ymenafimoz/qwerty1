<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <h2>Регистрация</h2>
        <form id="registrationForm1">
            <div class="form-group">
                <label for="usernamereg">Имя пользователя</label>
                <input type="text" id="usernamereg" name="usernamereg" required>
            </div>
            <div class="form-group">
                <label for="passwordreg">Пароль</label>
                <input type="password" id="passwordreg" name="passwordreg" required>
            </div>
            <button value='12' listener="submit" name="submit" id="submit" type="submit">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a href="trpoaut.html">Войти</a></p>
    </div>
    <script src="fss.js"></script>
</body>
</html>
