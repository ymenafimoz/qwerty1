    <script>
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalCost = 0;

            if (cart.length === 0) {
                document.getElementById('textCart').innerText = 'Корзина пустая';
                cartItemsContainer.innerHTML = '';
                return;
            }

            cartItemsContainer.innerHTML = '';

            cart.forEach(item => {
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" width="100" height="150">
                    <p>${item.name}</p>
                    <p>Дата: ${item.model}</p>
                    <p>Цена: ${item.price} руб</p>
                `;
                cartItemsContainer.appendChild(itemElement);
                totalCost += item.price;
            });

            const totalCostElement = document.createElement('h2');
            totalCostElement.innerText = `Общая стоимость: ${totalCost} руб`;
            cartItemsContainer.appendChild(totalCostElement);
        }

        function clearCart() {
            localStorage.removeItem('cart');
            updateCartUI();
        }

        document.getElementById('clearCartButton').addEventListener('click', clearCart);

        document.addEventListener('DOMContentLoaded', function() {
    updateCartUI();
    updateUI();

    document.getElementById('sendButton').addEventListener('click', function() {
        const email = document.getElementById('emailInput').value;

        if (email) {
            // Логика для обработки оплаты
            alert('Оплата успешна!');
        } else {
            alert('Пожалуйста, введите ваш номер карты.');
        }
    });
});


        document.addEventListener('DOMContentLoaded', updateCartUI);
        
        document.addEventListener('DOMContentLoaded', updateUI);

            const username = localStorage.getItem('username');
            const password = localStorage.getItem('password');
            if (username && password) {
                document.getElementById('profileButton').style.display = 'inline';
                document.getElementById('registrationButton').style.display = 'none';
                document.getElementById('authorizationButton').style.display = 'none';
            }
        }

        })();
    </script>
